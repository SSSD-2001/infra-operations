<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="/wso2-logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>WSO2 Internal App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        if (window.location.pathname !== "/github/callback") return;
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var state = params.get("state");
        if (!code || !state) return;
    
        sessionStorage.setItem("gh_pending_oauth_code", code);
        sessionStorage.setItem("gh_oauth_callback_state", state);
    
        var returnPath = "/";
        try {
          var raw = sessionStorage.getItem("gh_oauth_state");
          if (raw) {
            var obj = JSON.parse(raw);
            if (obj && obj.returnPath) returnPath = obj.returnPath;
          }
        } catch (e) {}
    
        // Leave callback before React mounts — go straight home
        window.location.replace(returnPath);
      })();
    </script>
    <script src="/config.js"></script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
